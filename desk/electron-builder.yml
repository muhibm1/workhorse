appId: dev.workhorse.paddock
productName: Paddock
# Output lives outside the repository: the plugin installer copies the whole plugin folder into
# ~/.claude/plugins/cache per version, and a dist/ of 250 MB executables filled the disk.
directories: { output: ../../Paddock-builds, buildResources: build }
files: [out/**, package.json]
extraResources:
  - { from: resources/plugin, to: plugin }
  - { from: resources/fonts, to: fonts }
  # Supabase's root certificate: every Studbook database connection is verified against it
  # (src/main/studbook/index.ts). Resolved by resolveStudbookCaPath() in src/main/index.ts.
  - { from: resources/studbook, to: studbook }
# Native modules load their binaries by filesystem path, which an asar archive cannot serve:
# onnxruntime-node (transformers.js's inference backend) and sharp (its image dependency).
asarUnpack:
  - "**/onnxruntime-node/**"
  - "**/sharp/**"
  - "**/@img/**"
win: { target: [portable] }
portable: { artifactName: "Paddock-${version}-portable.exe" }
mac: { target: [dmg], category: public.app-category.developer-tools }
linux: { target: [AppImage] }
